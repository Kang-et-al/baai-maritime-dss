name: Hex expansion checks
on:
  pull_request:
    paths:
      - 'extensions/hex_v03/**'
      - '.github/workflows/hex-v03.yml'
permissions:
  contents: read
jobs:
  hex-small-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: extensions/hex_v03
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python scripts/check_version.py
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest experimental_dp.test_kernel.SelectiveTests experimental_dp.test_threaded.ThreadedTests experimental_dp.test_policy.PolicyTests -v
      - run: python -m unittest discover -s tests -v
        working-directory: .
