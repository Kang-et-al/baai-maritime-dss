[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "baai-maritime-hex-local"
version = "0.3.0.dev1"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy==2.3.5", "Pillow==12.3.0", "shapely==2.2.0", "numba==0.68.1", "psutil==7.2.2"]

[tool.setuptools.packages.find]
include = ["hex_dss*", "experimental_dp*"]
